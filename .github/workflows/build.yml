name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Build app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  module:
    name: Build module zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Pack module
        run: python3 scripts/build_module.py
      - name: Upload module zip (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: release/*.zip
          if-no-files-found: error

# Releases are cut locally with scripts/bump_release.py so the manager APK is
# signed with the project keystore. CI only verifies that both artifacts build
# from a clean checkout; it never uploads to a GitHub Release.
